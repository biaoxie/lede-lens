<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">LedeLens analyzing a neutral sample news article</title>
  <desc id="desc">A fictional city library article appears beside the LedeLens side panel, which shows a mostly supported overall finding and a bounded conclusion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ec"/>
      <stop offset="1" stop-color="#e7ded0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#392d22" flood-opacity=".16"/>
    </filter>
    <clipPath id="browser">
      <rect x="70" y="172" width="1300" height="620" rx="14"/>
    </clipPath>
  </defs>
  <rect width="1440" height="860" fill="url(#bg)"/>
  <circle cx="1308" cy="92" r="98" fill="#b84a2b" opacity=".08"/>
  <circle cx="92" cy="770" r="130" fill="#2f6b4f" opacity=".07"/>

  <g transform="translate(70 50)">
    <circle cx="28" cy="28" r="25" fill="#b84a2b"/>
    <circle cx="24" cy="24" r="11" fill="none" stroke="#fffdf8" stroke-width="4"/>
    <path d="M32 32l10 10" stroke="#fffdf8" stroke-width="4" stroke-linecap="round"/>
    <text x="68" y="22" fill="#84351f" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">LEDELENS</text>
    <text x="68" y="50" fill="#1b1b19" font-family="Georgia, serif" font-size="31" font-weight="700">Read the reasoning behind the headline.</text>
  </g>
  <text x="1128" y="95" fill="#6f6d66" font-family="Arial, sans-serif" font-size="15" text-anchor="end">A structural reading aid for news</text>

  <g filter="url(#shadow)">
    <rect x="70" y="172" width="1300" height="620" rx="14" fill="#fffdf8"/>
  </g>
  <g clip-path="url(#browser)">
    <rect x="70" y="172" width="1300" height="48" fill="#2d2d2b"/>
    <circle cx="98" cy="196" r="6" fill="#e66f5d"/>
    <circle cx="120" cy="196" r="6" fill="#e9b64f"/>
    <circle cx="142" cy="196" r="6" fill="#68b56b"/>
    <rect x="188" y="184" width="718" height="24" rx="12" fill="#454542"/>
    <text x="210" y="201" fill="#d8d8d4" font-family="Arial, sans-serif" font-size="11">arborcitygazette.example/local/library-weekend-hours</text>
    <rect x="70" y="220" width="830" height="572" fill="#ffffff"/>
    <rect x="900" y="220" width="470" height="572" fill="#f5f1e8"/>

    <text x="116" y="262" fill="#9a3429" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">ARBOR CITY GAZETTE</text>
    <line x1="116" y1="278" x2="852" y2="278" stroke="#ded8ce"/>
    <text x="116" y="326" fill="#1b1b19" font-family="Georgia, serif" font-size="34" font-weight="700">City library extends weekend hours</text>
    <text x="116" y="365" fill="#1b1b19" font-family="Georgia, serif" font-size="34" font-weight="700">after six-month pilot</text>
    <text x="116" y="398" fill="#6f6d66" font-family="Arial, sans-serif" font-size="13">Maya Chen · Community desk · 6 paragraphs</text>
    <rect x="116" y="424" width="736" height="1" fill="#ded8ce"/>
    <text x="116" y="462" fill="#30302d" font-family="Georgia, serif" font-size="17">
      <tspan x="116" dy="0">The Arbor City Library will keep its doors open later on Saturdays</tspan>
      <tspan x="116" dy="27">after a six-month pilot drew more weekend visitors.</tspan>
    </text>
    <text x="116" y="536" fill="#30302d" font-family="Georgia, serif" font-size="17">
      <tspan x="116" dy="0">Library records show an 18% increase in Saturday visits compared</tspan>
      <tspan x="116" dy="27">with the same months last year. A visitor survey found that 72%</tspan>
      <tspan x="116" dy="27">of respondents wanted the extended schedule to continue.</tspan>
    </text>
    <text x="116" y="637" fill="#30302d" font-family="Georgia, serif" font-size="17">
      <tspan x="116" dy="0">Officials said the pilot informed the decision, while noting that</tspan>
      <tspan x="116" dy="27">seasonal events may also have affected attendance.</tspan>
    </text>

    <text x="928" y="254" fill="#84351f" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">NEWS STRUCTURE AUDIT</text>
    <text x="928" y="285" fill="#1b1b19" font-family="Georgia, serif" font-size="25" font-weight="700">LedeLens</text>
    <circle cx="1041" cy="277" r="8" fill="none" stroke="#6f6d66"/>
    <text x="1041" y="281" text-anchor="middle" fill="#6f6d66" font-family="Arial, sans-serif" font-size="10" font-weight="700">i</text>
    <rect x="928" y="310" width="414" height="72" rx="4" fill="#fffdf8" stroke="#d9d2c5"/>
    <text x="946" y="334" fill="#84351f" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">DETECTED SOURCE</text>
    <text x="946" y="357" fill="#1b1b19" font-family="Georgia, serif" font-size="15" font-weight="700">City library extends weekend hours</text>
    <text x="946" y="373" fill="#6f6d66" font-family="Arial, sans-serif" font-size="10">Maya Chen · 6 paragraphs</text>

    <rect x="928" y="398" width="414" height="180" rx="5" fill="#fffdf8" stroke="#d9d2c5"/>
    <text x="948" y="425" fill="#84351f" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">OVERALL FINDING</text>
    <rect x="946" y="442" width="172" height="37" rx="18" fill="#dfeee5"/>
    <circle cx="968" cy="460" r="5" fill="#2f6b4f"/>
    <text x="985" y="466" fill="#2f6b4f" font-family="Georgia, serif" font-size="17" font-weight="700">Mostly supported</text>
    <text x="946" y="508" fill="#1b1b19" font-family="Arial, sans-serif" font-size="12" font-weight="700">Presentation style</text>
    <text x="1270" y="508" fill="#2f6b4f" font-family="Arial, sans-serif" font-size="12" font-weight="700" text-anchor="end">Restrained</text>
    <text x="946" y="535" fill="#50504b" font-family="Arial, sans-serif" font-size="11">
      <tspan x="946" dy="0">The main decision is supported by attendance records</tspan>
      <tspan x="946" dy="18">and a survey, with uncertainty kept visible.</tspan>
    </text>

    <rect x="928" y="594" width="414" height="160" rx="5" fill="#fffdf8" stroke="#d9d2c5"/>
    <text x="948" y="622" fill="#1b1b19" font-family="Georgia, serif" font-size="17" font-weight="700">What the article can support</text>
    <line x1="948" y1="641" x2="948" y2="719" stroke="#b84a2b" stroke-width="3"/>
    <text x="964" y="659" fill="#3c3c38" font-family="Georgia, serif" font-size="12">
      <tspan x="964" dy="0">The pilot coincided with higher Saturday attendance,</tspan>
      <tspan x="964" dy="19">and the survey supports continuing longer hours.</tspan>
      <tspan x="964" dy="19">The article does not prove the schedule alone caused</tspan>
      <tspan x="964" dy="19">the increase.</tspan>
    </text>
  </g>
  <text x="720" y="830" text-anchor="middle" fill="#6f6d66" font-family="Arial, sans-serif" font-size="13">Fictional article and illustrative analysis · No real publisher, person, or event</text>
</svg>
