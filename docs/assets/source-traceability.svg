<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">LedeLens paragraph-level traceability</title>
  <desc id="desc">A material issue in LedeLens links through paragraph badges to a highlighted paragraph in a fictional neutral article.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4eee3"/>
      <stop offset="1" stop-color="#ebe4d9"/>
    </linearGradient>
    <filter id="s2" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#392d22" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#b84a2b"/>
    </marker>
  </defs>
  <rect width="1440" height="720" fill="url(#bg2)"/>
  <text x="72" y="72" fill="#84351f" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">SOURCE TRACEABILITY</text>
  <text x="72" y="116" fill="#1b1b19" font-family="Georgia, serif" font-size="34" font-weight="700">Follow paragraph badges back to the article.</text>
  <text x="72" y="148" fill="#6f6d66" font-family="Arial, sans-serif" font-size="15">Inspect the supporting passages in context.</text>

  <g filter="url(#s2)">
    <rect x="72" y="192" width="554" height="438" rx="10" fill="#fffdf8"/>
    <rect x="814" y="192" width="554" height="438" rx="10" fill="#fff"/>
  </g>

  <text x="104" y="232" fill="#84351f" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">LEDELENS · WHAT TO WATCH</text>
  <text x="104" y="275" fill="#1b1b19" font-family="Georgia, serif" font-size="23" font-weight="700">Cause not demonstrated</text>
  <rect x="481" y="250" width="92" height="30" rx="15" fill="#f8e9cc"/>
  <text x="527" y="270" fill="#9b6515" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MEDIUM</text>
  <text x="104" y="316" fill="#494945" font-family="Arial, sans-serif" font-size="14">
    <tspan x="104" dy="0">The article shows that attendance rose during the pilot,</tspan>
    <tspan x="104" dy="23">but it does not establish that longer hours were the only</tspan>
    <tspan x="104" dy="23">cause. Seasonal events may also have contributed.</tspan>
  </text>
  <rect x="104" y="398" width="46" height="28" rx="14" fill="#f5e4da" stroke="#cbbdac"/>
  <text x="127" y="417" fill="#84351f" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">p2</text>
  <rect x="158" y="398" width="46" height="28" rx="14" fill="#b84a2b"/>
  <text x="181" y="417" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle">p3</text>
  <text x="104" y="476" fill="#6f6d66" font-family="Arial, sans-serif" font-size="12">Select a badge to scroll to and highlight its source paragraph.</text>
  <line x1="104" y1="506" x2="594" y2="506" stroke="#e1dbd1"/>
  <text x="104" y="544" fill="#1b1b19" font-family="Georgia, serif" font-size="17" font-weight="700">Why this matters</text>
  <text x="104" y="573" fill="#575752" font-family="Arial, sans-serif" font-size="13">
    <tspan x="104" dy="0">A score becomes useful when readers can inspect the exact</tspan>
    <tspan x="104" dy="21">passage behind it instead of treating it as a black box.</tspan>
  </text>

  <path d="M626 412C698 412 733 412 804 412" fill="none" stroke="#b84a2b" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="714" cy="412" r="22" fill="#fffdf8" stroke="#b84a2b" stroke-width="2"/>
  <text x="714" y="417" text-anchor="middle" fill="#84351f" font-family="Arial, sans-serif" font-size="11" font-weight="700">p3</text>

  <text x="848" y="232" fill="#9a3429" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">ARBOR CITY GAZETTE · FICTIONAL SAMPLE</text>
  <text x="848" y="274" fill="#1b1b19" font-family="Georgia, serif" font-size="23" font-weight="700">Library keeps later Saturday hours</text>
  <text x="848" y="306" fill="#6f6d66" font-family="Arial, sans-serif" font-size="11">Maya Chen · Community desk</text>
  <text x="848" y="354" fill="#3d3d39" font-family="Georgia, serif" font-size="15">
    <tspan x="848" dy="0">p2 · Library records show an 18% increase in Saturday</tspan>
    <tspan x="848" dy="24">visits compared with the same months last year.</tspan>
  </text>
  <rect x="836" y="398" width="500" height="100" rx="5" fill="#fff0e9" stroke="#b84a2b" stroke-width="2"/>
  <rect x="850" y="414" width="36" height="23" rx="11" fill="#b84a2b"/>
  <text x="868" y="430" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="10" font-weight="700">p3</text>
  <text x="898" y="433" fill="#2f2f2c" font-family="Georgia, serif" font-size="15">
    <tspan x="898" dy="0">Officials said the pilot informed the decision,</tspan>
    <tspan x="898" dy="23">while noting that seasonal events may also have</tspan>
    <tspan x="898" dy="23">affected attendance.</tspan>
  </text>
  <text x="848" y="548" fill="#3d3d39" font-family="Georgia, serif" font-size="15">
    <tspan x="848" dy="0">p4 · The library will review attendance again after</tspan>
    <tspan x="848" dy="24">the new schedule has been in place for one year.</tspan>
  </text>
  <text x="720" y="685" text-anchor="middle" fill="#6f6d66" font-family="Arial, sans-serif" font-size="12">Illustrative product graphic using fictional, non-political content</text>
</svg>
