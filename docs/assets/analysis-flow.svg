<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">LedeLens three-step analysis flow</title>
  <desc id="desc">Three interface cards show source detection, narrative progress, and a locally restored analysis for a fictional neutral article.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f4ec"/>
      <stop offset="1" stop-color="#e9e0d3"/>
    </linearGradient>
    <filter id="s3" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#392d22" flood-opacity=".13"/>
    </filter>
  </defs>
  <rect width="1440" height="720" fill="url(#bg3)"/>
  <text x="72" y="72" fill="#84351f" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">FROM ARTICLE TO AUDIT</text>
  <text x="72" y="116" fill="#1b1b19" font-family="Georgia, serif" font-size="34" font-weight="700">See the work. Reopen the result without another request.</text>
  <text x="72" y="148" fill="#6f6d66" font-family="Arial, sans-serif" font-size="15">A visible workflow keeps readers oriented from extraction through local restoration.</text>

  <g filter="url(#s3)">
    <rect x="72" y="202" width="390" height="420" rx="10" fill="#fffdf8"/>
    <rect x="525" y="202" width="390" height="420" rx="10" fill="#fffdf8"/>
    <rect x="978" y="202" width="390" height="420" rx="10" fill="#fffdf8"/>
  </g>

  <circle cx="108" cy="242" r="18" fill="#b84a2b"/>
  <text x="108" y="248" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">1</text>
  <text x="140" y="248" fill="#1b1b19" font-family="Georgia, serif" font-size="21" font-weight="700">Detect the source</text>
  <line x1="96" y1="270" x2="438" y2="270" stroke="#ded8ce"/>
  <text x="98" y="306" fill="#84351f" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">DETECTED SOURCE</text>
  <text x="98" y="340" fill="#1b1b19" font-family="Georgia, serif" font-size="18" font-weight="700">City library extends</text>
  <text x="98" y="365" fill="#1b1b19" font-family="Georgia, serif" font-size="18" font-weight="700">weekend hours</text>
  <text x="98" y="392" fill="#6f6d66" font-family="Arial, sans-serif" font-size="11">Maya Chen · 6 paragraphs</text>
  <rect x="98" y="430" width="316" height="44" rx="4" fill="#b84a2b"/>
  <text x="256" y="457" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Analyze article</text>
  <text x="98" y="520" fill="#575752" font-family="Arial, sans-serif" font-size="12">
    <tspan x="98" dy="0">LedeLens extracts the readable article locally</tspan>
    <tspan x="98" dy="20">and assigns stable paragraph IDs.</tspan>
  </text>

  <circle cx="561" cy="242" r="18" fill="#b84a2b"/>
  <text x="561" y="248" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">2</text>
  <text x="593" y="248" fill="#1b1b19" font-family="Georgia, serif" font-size="21" font-weight="700">Follow the analysis</text>
  <line x1="549" y1="270" x2="891" y2="270" stroke="#ded8ce"/>
  <circle cx="574" cy="315" r="13" fill="none" stroke="#b84a2b" stroke-width="3" stroke-dasharray="18 8"/>
  <text x="600" y="320" fill="#1b1b19" font-family="Arial, sans-serif" font-size="13" font-weight="700">Analyzing article structure</text>
  <text x="859" y="320" text-anchor="end" fill="#6f6d66" font-family="Arial, sans-serif" font-size="11">0:04</text>
  <text x="552" y="360" fill="#575752" font-family="Arial, sans-serif" font-size="12">OpenAI is preparing the structured report.</text>
  <line x1="562" y1="405" x2="562" y2="520" stroke="#d9d2c5" stroke-width="2"/>
  <circle cx="562" cy="410" r="7" fill="#2f6b4f"/>
  <text x="584" y="415" fill="#2f6b4f" font-family="Arial, sans-serif" font-size="12" font-weight="700">Extract source</text>
  <circle cx="562" cy="448" r="7" fill="#b84a2b"/>
  <text x="584" y="453" fill="#1b1b19" font-family="Arial, sans-serif" font-size="12" font-weight="700">Analyze structure</text>
  <circle cx="562" cy="486" r="7" fill="#fffdf8" stroke="#bdb5a7" stroke-width="2"/>
  <text x="584" y="491" fill="#6f6d66" font-family="Arial, sans-serif" font-size="12">Validate report</text>
  <circle cx="562" cy="524" r="7" fill="#fffdf8" stroke="#bdb5a7" stroke-width="2"/>
  <text x="584" y="529" fill="#6f6d66" font-family="Arial, sans-serif" font-size="12">Render findings</text>
  <text x="552" y="578" fill="#575752" font-family="Arial, sans-serif" font-size="12">Narrative status makes long requests feel active.</text>

  <circle cx="1014" cy="242" r="18" fill="#b84a2b"/>
  <text x="1014" y="248" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700">3</text>
  <text x="1046" y="248" fill="#1b1b19" font-family="Georgia, serif" font-size="21" font-weight="700">Return without rerunning</text>
  <line x1="1002" y1="270" x2="1344" y2="270" stroke="#ded8ce"/>
  <rect x="1004" y="298" width="338" height="48" rx="4" fill="#edf4ef" stroke="#b9d4c4"/>
  <circle cx="1025" cy="322" r="6" fill="#2f6b4f"/>
  <text x="1042" y="326" fill="#2f6b4f" font-family="Arial, sans-serif" font-size="11" font-weight="700">Loaded the saved analysis for this page.</text>
  <text x="1004" y="386" fill="#84351f" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">OVERALL FINDING</text>
  <rect x="1004" y="405" width="178" height="38" rx="19" fill="#dfeee5"/>
  <circle cx="1026" cy="424" r="5" fill="#2f6b4f"/>
  <text x="1042" y="430" fill="#2f6b4f" font-family="Georgia, serif" font-size="16" font-weight="700">Mostly supported</text>
  <text x="1004" y="484" fill="#1b1b19" font-family="Georgia, serif" font-size="17" font-weight="700">What the article can support</text>
  <text x="1004" y="515" fill="#575752" font-family="Arial, sans-serif" font-size="11">
    <tspan x="1004" dy="0">The pilot coincided with higher attendance,</tspan>
    <tspan x="1004" dy="18">but the schedule alone is not proven causal.</tspan>
  </text>
  <rect x="1004" y="558" width="156" height="34" rx="4" fill="#fffdf8" stroke="#b84a2b"/>
  <text x="1082" y="580" text-anchor="middle" fill="#84351f" font-family="Arial, sans-serif" font-size="11" font-weight="700">Re-analyze article</text>

  <path d="M470 412H510" stroke="#b84a2b" stroke-width="3"/>
  <path d="M500 402L512 412L500 422" fill="none" stroke="#b84a2b" stroke-width="3"/>
  <path d="M923 412H963" stroke="#b84a2b" stroke-width="3"/>
  <path d="M953 402L965 412L953 422" fill="none" stroke="#b84a2b" stroke-width="3"/>
  <text x="720" y="684" text-anchor="middle" fill="#6f6d66" font-family="Arial, sans-serif" font-size="12">Illustrative product graphic using fictional, non-political content</text>
</svg>
