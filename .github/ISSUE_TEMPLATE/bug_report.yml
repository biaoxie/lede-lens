name: Bug report
description: Report a reproducible problem in LedeLens.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, private article text, or security vulnerabilities in a public issue.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: LedeLens version
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Remove credentials and private content before sharing logs or screenshots.
